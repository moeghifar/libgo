name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # make secrets scans full history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # go 1.27.3: earlier 1.27 patches have stdlib advisories
      - run: make verify
      - run: make vet
      - run: make test
      - run: make lint
      - run: make security
      - run: make vuln
      - run: make trivy
      - run: make secrets
      - run: make docker
